<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadow for clean depth if needed -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Circular White Background -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- House / Sunrise Rays (Yellow Roof Structure) -->
  <g fill="none" stroke="#FDE047" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arch / Roof -->
    <path d="M 160 215 C 160 170 200 135 250 135 C 300 135 340 170 340 215" stroke-width="14" stroke="#FDE047" />
    <!-- Middle Triangular Pagoda / Roof Layer -->
    <path d="M 175 205 L 250 155 L 325 205" stroke-width="12" stroke="#FACC15" />
    <!-- Inner Peak -->
    <path d="M 195 200 L 250 168 L 305 200" stroke-width="10" stroke="#EAB308" />
  </g>

  <!-- Sun Rays behind roof -->
  <path d="M 190 190 C 205 160 225 145 250 145 C 275 145 295 160 310 190 Z" fill="#FEF08A" opacity="0.6" />

  <!-- Characters Group -->
  <!-- 1. Left Green Child (Green #22C55E) -->
  <g fill="#22C55E">
    <!-- Head -->
    <circle cx="185" cy="235" r="9" />
    <!-- Body & Limbs -->
    <path d="M 180 246 C 177 246 174 250 171 254 C 168 258 171 260 174 258 C 176 256 178 253 180 251 L 180 270 L 184 270 L 184 285 L 187 285 L 187 270 L 189 270 L 189 285 L 192 285 L 192 270 L 196 270 L 196 251 C 198 253 200 256 202 258 C 205 260 208 258 205 254 C 202 250 199 246 196 246 Z" />
  </g>

  <!-- 2. Purple Child Girl (#A855F7) -->
  <g fill="#9333EA">
    <!-- Hair Pigtails / Head -->
    <circle cx="215" cy="226" r="11" />
    <circle cx="204" cy="224" r="4" />
    <!-- Dress & Arms -->
    <!-- Left arm raised/waving -->
    <path d="M 210 238 L 192 232 C 189 231 188 234 191 236 L 208 243 L 206 274 L 224 274 L 222 243 L 235 238 C 238 237 237 233 234 234 L 220 238 Z" />
    <polygon points="204,272 226,272 230,285 200,285" />
    <!-- Legs -->
    <rect x="210" y="285" width="4" height="12" rx="2" fill="#9333EA" />
    <rect x="216" y="285" width="4" height="12" rx="2" fill="#9333EA" />
  </g>

  <!-- 3. Center Red Teacher (#E11D48 / #DC2626) -->
  <g fill="#DC2626">
    <!-- Head with hair bun -->
    <circle cx="252" cy="214" r="13" />
    <path d="M 243 207 C 236 205 232 210 235 216 C 238 221 245 220 245 214 Z" />
    <circle cx="236" cy="212" r="5" />
    
    <!-- Body / Teacher Dress -->
    <!-- Arms & Dress -->
    <path d="M 243 229 C 238 230 235 233 230 240 C 227 244 231 247 234 243 L 241 235 L 239 285 L 265 285 L 263 235 L 286 222 C 289 220 286 217 283 219 L 263 229 Z" />
    <polygon points="236,283 268,283 273,308 231,308" />
    <!-- Legs -->
    <rect x="245" y="308" width="5" height="14" rx="2" fill="#DC2626" />
    <rect x="254" y="308" width="5" height="14" rx="2" fill="#DC2626" />
  </g>

  <!-- Folder/Book held by Teacher (#FACC15) -->
  <polygon points="248,250 258,247 258,266 248,268" fill="#FACC15" stroke="#EAB308" stroke-width="1.5" />

  <!-- 4. Blue Boy Child (#2563EB) -->
  <g fill="#2563EB">
    <!-- Head -->
    <circle cx="298" cy="226" r="11" />
    <!-- Body & Raised Hand -->
    <path d="M 293 238 L 286 245 C 284 247 287 250 289 248 L 293 243 L 291 272 L 305 272 L 303 243 L 318 231 C 321 229 319 225 316 227 L 303 238 Z" />
    <polygon points="290,270 306,270 307,284 289,284" />
    <!-- Legs -->
    <rect x="292" y="284" width="4" height="13" rx="2" fill="#2563EB" />
    <rect x="300" y="284" width="4" height="13" rx="2" fill="#2563EB" />
  </g>

  <!-- 5. Right Orange Child Girl (#F97316) -->
  <g fill="#F97316">
    <!-- Head with buns -->
    <circle cx="330" cy="242" r="9" />
    <circle cx="323" cy="237" r="3.5" />
    <circle cx="337" cy="237" r="3.5" />
    <!-- Body & Waving Hands -->
    <path d="M 326 253 L 320 250 C 318 249 317 252 319 254 L 325 258 L 322 280 L 338 280 L 335 258 L 343 252 C 345 250 343 247 341 249 L 334 253 Z" />
    <polygon points="321,279 339,279 342,290 318,290" />
    <!-- Legs -->
    <rect x="325" y="290" width="3.5" height="9" rx="1.5" fill="#F97316" />
    <rect x="331" y="290" width="3.5" height="9" rx="1.5" fill="#F97316" />
  </g>

  <!-- Sparkle / Star over BRIGHT 'I' -->
  <path d="M 239 319 Q 239 326 232 326 Q 239 326 239 333 Q 239 326 246 326 Q 239 326 239 319 Z" fill="#FBBF24" />

  <!-- Typography: BRIGHT -->
  <text x="250" y="358" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="3" 
        fill="#E11D48" 
        text-anchor="middle">
    BRIGHT
  </text>

  <!-- Typography: MANDARIN -->
  <text x="250" y="394" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="29" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#0284C7" 
        text-anchor="middle">
    MANDARIN
  </text>

  <!-- Chinese Subtitle: 明辉补习班 -->
  <text x="250" y="423" 
        font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
        font-size="22" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#64748B" 
        text-anchor="middle">
    明辉补习班
  </text>
</svg>
